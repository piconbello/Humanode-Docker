name: test-and-publish

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'docker-compose.yml'
      - '.env.example'

jobs:
  bot-unit-tests:
    name: Bot unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install bot + dev deps
        working-directory: bot
        run: pip install -e ".[dev]"
      - name: pytest
        working-directory: bot
        run: pytest -q

  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build (amd64, loadable)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          tags: hmnd-validator:test
          outputs: type=docker,dest=/tmp/hmnd-validator.tar
      - name: Upload image artifact
        uses: actions/upload-artifact@v6
        with:
          name: hmnd-validator-image
          path: /tmp/hmnd-validator.tar
          retention-days: 1

  image-tests:
    name: Image-level tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: hmnd-validator-image
          path: /tmp
      - name: Load image
        run: docker load -i /tmp/hmnd-validator.tar
      - name: test_image_build
        run: IMAGE=hmnd-validator:test sh tests/image/test_image_build.sh
      - name: test_entrypoint_routing
        run: IMAGE=hmnd-validator:test sh tests/image/test_entrypoint_routing.sh
      - name: test_insert_key
        run: IMAGE=hmnd-validator:test sh tests/image/test_insert_key.sh
      - name: test_seed_not_logged
        run: IMAGE=hmnd-validator:test sh tests/image/test_seed_not_logged.sh

  sync-test:
    name: Sync + RPC contract test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: hmnd-validator-image
          path: /tmp
      - name: Load image
        run: docker load -i /tmp/hmnd-validator.tar
      - name: sync-test
        env:
          IMAGE: hmnd-validator:test
          PEER_BUDGET_S: "180"
          PROGRESS_BUDGET_S: "480"
        run: sh ci/sync-test.sh
      - name: rpc-contract-test
        run: |
          docker rm -f hmnd-rpc-ct 2>/dev/null || true
          docker volume create hmnd-rpc-ct-vol
          docker run -d --name hmnd-rpc-ct -v hmnd-rpc-ct-vol:/data hmnd-validator:test
          for i in $(seq 1 60); do
            if docker exec hmnd-rpc-ct sh -c 'curl -sS -o /dev/null -H "Content-Type: application/json" -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"system_health\",\"params\":[]}" http://127.0.0.1:9944' 2>/dev/null; then break; fi
            sleep 2
          done
          python3 ci/rpc-contract-test.py hmnd-rpc-ct
          docker rm -f hmnd-rpc-ct
          docker volume rm hmnd-rpc-ct-vol

  automerge:
    name: Auto-merge peer bump
    needs: [bot-unit-tests, image-tests, sync-test]
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'chore/peer-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check PR only touches the peer pin
        run: |
          files="$(gh pr diff "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --name-only)"
          echo "$files"
          if [ "$files" != "artifacts/humanode-peer.env" ]; then
            echo "::error::peer bump PR touches more than artifacts/humanode-peer.env; leaving it for a human"
            exit 1
          fi
      - name: Merge
        run: gh pr merge "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$GITHUB_SHA"
      - name: Publish from main
        run: gh workflow run test-and-publish.yml --repo "$GITHUB_REPOSITORY" --ref main

  publish:
    name: Publish to GHCR
    needs: [bot-unit-tests, image-tests, sync-test]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Compute version + internal revision
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < artifacts/humanode-version.txt)"
          LAST_VER_COMMIT="$(git log -1 --format=%H -- artifacts/humanode-version.txt)"
          if [ -z "$LAST_VER_COMMIT" ]; then
            echo "::error::artifacts/humanode-version.txt has no git history"
            exit 1
          fi
          N=$(( $(git rev-list --count --first-parent "${LAST_VER_COMMIT}..HEAD" \
                    -- . ':!**/*.md' ':!docs/**' ':!docker-compose.yml' ':!.env.example') + 1 ))
          echo "upstream=$VERSION" >> "$GITHUB_OUTPUT"
          echo "internal=${VERSION}-r${N}" >> "$GITHUB_OUTPUT"
          . artifacts/humanode-peer.env
          echo "peer_tag=$PEER_TAG" >> "$GITHUB_OUTPUT"
          echo "peer_commit=$PEER_COMMIT" >> "$GITHUB_OUTPUT"
          echo "peer_short=$(printf '%s' "$PEER_COMMIT" | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build + push (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.internal }}
            PEER_TAG=${{ steps.version.outputs.peer_tag }}
            PEER_COMMIT=${{ steps.version.outputs.peer_commit }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.version.outputs.internal }}
            ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.version.outputs.upstream }}
            ghcr.io/${{ steps.repo.outputs.name }}:peer-${{ steps.version.outputs.peer_short }}
            ghcr.io/${{ steps.repo.outputs.name }}:latest
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.internal }}"
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 && exit 0

          PREV_TAG=$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)

          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          fi

          NOTES="## Docker image
          \`\`\`
          docker pull ghcr.io/${{ steps.repo.outputs.name }}:$TAG
          \`\`\`

          **Tags:** \`$TAG\` · \`${{ steps.version.outputs.upstream }}\` · \`peer-${{ steps.version.outputs.peer_short }}\` · \`latest\`

          **humanode-peer:** \`${{ steps.version.outputs.peer_tag }}\` (\`${{ steps.version.outputs.peer_commit }}\`)

          ## Changelog
          ${CHANGELOG}"

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes "$NOTES" \
            --latest
